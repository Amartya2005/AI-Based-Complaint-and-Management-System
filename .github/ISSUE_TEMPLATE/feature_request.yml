name: Feature request
description: Propose an improvement to the CCMS workflow or platform.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Describe the user problem first. Avoid including personal or confidential complaint data.
  - type: dropdown
    id: role
    attributes:
      label: Primary user
      options:
        - Student
        - Staff
        - Administrator
        - Developer / Operator
        - Multiple roles
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What is difficult, missing, or unnecessarily time-consuming today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain the desired workflow without prescribing an implementation unnecessarily.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable outcomes that would show the change is complete.
      placeholder: |
        - [ ] A user can...
        - [ ] Unauthorized users cannot...
        - [ ] Existing workflows continue to...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      validations:
        required: false
